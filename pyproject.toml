[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer-local"
version = "0.3.0"
description = "Inventaire personnel, archivage vérifié et nettoyage après confirmation"
requires-python = ">=3.11"
dependencies = ["pywin32==311; sys_platform == 'win32'"]

[project.scripts]
file-organizer = "file_organizer.__main__:main"

[tool.setuptools.package-data]
file_organizer = ["static/*"]

[tool.setuptools.packages.find]
include = ["file_organizer*"]
